# ═══════════════════════════════════════════════════════════════
#           TrendRadar 崇左市社会治安舆情监控系统
#              预配置版本 - 直接复制到 config.yaml 使用
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# ===============================================================
# 调度系统 - 早晚推送模式（适合公职人员）
# ===============================================================
schedule:
  enabled: true
  preset: "morning_evening"   # 早间汇总 + 晚间当日总结

# ===============================================================
# 数据源 - 热榜平台（国内常用平台全覆盖）
# ===============================================================
platforms:
  enabled: true
  sources:
    - id: "weibo"
      name: "微博热搜"
    - id: "douyin"
      name: "抖音热搜"
    - id: "toutiao"
      name: "今日头条"
    - id: "baidu"
      name: "百度热搜"
    - id: "bilibili-hot-search"
      name: "B站热搜"
    - id: "zhihu"
      name: "知乎热榜"
    - id: "thepaper"
      name: "澎湃新闻"
    - id: "ifeng"
      name: "凤凰网"
    - id: "tieba"
      name: "百度贴吧"

# ===============================================================
# 数据源 - RSS 订阅（广西崇左本地源）
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    - id: "chongzuo-gov"
      name: "崇左市人民政府"
      url: "https://www.chongzuo.gov.cn/rss.xml"
    - id: "gxpolice"
      name: "广西公安"
      url: "https://www.gxpolice.com/rss"
    - id: "gxnews"
      name: "广西新闻网"
      url: "https://www.gxnews.com.cn/rss"

# ===============================================================
# 报告模式
# ===============================================================
report:
  mode: "daily"               # 每日汇总，信息最全
  display_mode: "keyword"     # 按关键词分组
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 10    # 每组最多显示10条，避免太长

# ===============================================================
# 筛选策略 - AI 智能筛选（推荐）
# ===============================================================
filter:
  method: "ai"               # 使用 AI 而非关键词匹配
  priority_sort_enabled: true

# ===============================================================
# AI 智能筛选配置
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.6             # 分数阈值适中，平衡精准度和召回率
  reclassify_threshold: 0.6
  interests_file: "config/custom/ai/ai_interests.txt"  # 崇左专用兴趣描述

# ===============================================================
# 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items              # 新增热点（第一时间知晓）
    - hotlist               # 热榜区域（AI 筛选结果）
    - rss                   # RSS 区域（本地政府动态）
    - ai_analysis           # AI 分析（舆情研判）

  regions:
    hotlist: true           # 热榜区域
    new_items: true         # 新增热点
    rss: true               # RSS 订阅
    standalone: false       # 独立展示区（关闭节省 token）
    ai_analysis: true       # AI 分析

  standalone:
    platforms: []            # 不启用独立展示
    rss_feeds: []
    max_items: 0

# ===============================================================
# 推送通知
# ⚠️ 请填写以下渠道的 Token/Key 后再启用
# ===============================================================
notification:
  enabled: true

  channels:
    # ===== 企业微信机器人（推荐 - 推送稳定）=====
    # 获取方式：企业微信群 → 群机器人 → 添加机器人 → 复制 Webhook URL 中的 key
    wework:
      webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=caa86bfc-61cc-4521-be6e-b8d4f8f40cc9"
      msg_type: "markdown"

    # ===== 钉钉机器人 =====
    # 获取方式：钉钉群 → 智能群助手 → 添加机器人 → 自定义机器人
    dingtalk:
      webhook_url: ""

    # ===== 飞书机器人 =====
    # 获取方式：飞书开放平台 → 创建应用 → 开启机器人能力 → 添加机器人
    feishu:
      webhook_url: ""

    # ===== PushPlus 个人微信 =====
    # 获取方式：微信关注"PushPlus"公众号，发送"Token"获取
    # 注意：PushPlus 通过 HTTP 接口推送，无需额外配置渠道
    generic_webhook:
      webhook_url: "https://www.pushplus.plus/send?token=761157f436364ca982ebb17085b422f4"
      payload_template: "{\"content\":\"{content}\"}"

    # ===== Telegram =====
    # 获取方式：找 @BotFather 创建机器人，复制 Token
    telegram:
      bot_token: ""
      chat_id: ""

    # ===== 邮件 =====
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    # ===== ntfy（轻量推送）=====
    ntfy:
      server_url: "https://ntfy.sh"
      topic: "trendradar-chongzuo"
      token: ""

    # ===== Bark（iOS 推送）=====
    bark:
      url: ""

    slack:
      webhook_url: ""

# ===============================================================
# 存储配置
# ===============================================================
storage:
  backend: "local"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 30       # 保留30天数据

# ===============================================================
# AI 模型配置
# ===============================================================
ai:
  # MiniMax（已配置）
  model: "minimax/MiniMax-Text-01"
  api_key: "sk-cp-4hiELfhxsUmZwImRzZoEDF4JS08cZbzJIFW5L-PmsUCBRQV1TF1iGXNcX9b7_PvDFjUjY6lHeacIPX8a9z5O9uIoaFDUeJWT_6crnkkIfZ1SfV5Juzsqkas"
  api_base: "https://api.minimax.chat/v1"

  # DeepSeek（备选）
  # model: "deepseek/deepseek-chat"
  # api_key: "YOUR_DEEPSEEK_API_KEY"
  # api_base: "https://api.deepseek.com"

  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models:
    - "openai/gpt-4o-mini"

# ===============================================================
# AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 100   # 控制成本
  include_rss: true
  include_standalone: false
  include_rank_timeline: false  # 关闭节省 token

# ===============================================================
# AI 翻译（中文内容无需翻译）
# ===============================================================
ai_translation:
  enabled: false

# ===============================================================
# 高级设置
# ===============================================================
advanced:
  debug: false
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
